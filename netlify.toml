[build]
  command = "npm run build"
  publish = "dist"

# IMPORTANT: If hosting the frontend on Netlify and backend on Render/Railway,
# replace "https://expense-tracker-for-esevai.onrender.com/" with your real deployed backend service URL!
[[redirects]]
  from = "/api/*"
  to = "https://expense-tracker-for-esevai.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
