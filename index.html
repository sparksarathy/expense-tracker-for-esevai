<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>e-Sevai Income & Expense Manager</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Tailwind CSS fonts will be imported in index.css -->
  </head>
  <body class="bg-slate-50 text-slate-900 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const isDev = window.location.hostname.includes('dev') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister().then((success) => {
                if (success) {
                  console.log('Successfully unregistered stale development service worker.');
                  // Clear client caches to resolve any stuck assets
                  if (window.caches) {
                    caches.keys().then((names) => {
                      for (const name of names) {
                        caches.delete(name);
                      }
                    });
                  }
                  // Force a reload once if a service worker was active, to restore normal server fetch flow
                  window.location.reload();
                }
              });
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
              .catch((err) => console.error('Service Worker registration failed:', err));
          });
        }
      }
    </script>
  </body>
</html>
